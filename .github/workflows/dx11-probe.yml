name: Archived DirectX 11 probe
# Fullscreen development abandoned on 2026-10-27; historical checks only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build baseline and test WARP rendering lifecycle
        shell: pwsh
        run: ./experimental/dx11-probe/Build.ps1
      - name: Compile GOverlay bridge and native renderer
        shell: pwsh
        run: ./experimental/dx11-probe/Build-WithGOverlay.ps1
      - name: Diagnose native probe failure
        if: failure()
        shell: pwsh
        run: |
          $probe = "experimental/dx11-probe/build-goverlay/Release/RiftDx11Probe.exe"
          $diagnostic = "experimental/dx11-probe/build-goverlay/Release/RiftProbeDiagnostic.exe"
          if (Test-Path $diagnostic) { & $diagnostic (Resolve-Path $probe).Path }
          Get-ChildItem "$env:LOCALAPPDATA/log/RiftDx11Probe*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content $_.FullName | Select-String 'failed|error|graphicsInit|graphicsWindow|window:|shader|hooked|swap:' | Select-Object -Last 80
          }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Build Electron offscreen producer
        run: node experimental/electron-fullscreen/build.mjs
      - name: Verify Electron panel pixels in DirectX output
        shell: pwsh
        run: |
          & ./node_modules/.bin/electron.cmd dist/fullscreen-probe/main.cjs --probe (Resolve-Path experimental/dx11-probe/build-goverlay/Release/RiftDx11Probe.exe).Path --smoke
          if ($LASTEXITCODE) { throw 'Electron to GOverlay rendering check failed.' }
      - name: Collect baseline executable and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe-artifact | Out-Null
          Copy-Item experimental/dx11-probe/build/Release/RiftDx11Probe.exe probe-artifact/
          Copy-Item experimental/dx11-probe/README.md probe-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: Rift-DirectX11-baseline-Windows
          path: probe-artifact/
          retention-days: 14
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DirectX11-test-evidence
          path: |
            experimental/dx11-probe/build/Testing/Temporary/LastTest.log
            experimental/dx11-probe/build-goverlay/Testing/Temporary/LastTest.log
            experimental/goverlay/reports/
            ${{ runner.temp }}/RiftDx11Probe-*.log
          if-no-files-found: warn
          retention-days: 14
