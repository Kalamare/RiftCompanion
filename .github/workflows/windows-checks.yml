name: Windows native checks
on:
  pull_request:
  push:
    branches: [main, codex/cloud-backend-handoff]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          Get-ChildItem server,native -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Build and run domain and WPF checks
        shell: pwsh
        run: ./native/Build.ps1 -Check
      - name: Check WPF isolation from launcher backend configuration
        shell: pwsh
        run: |
          $env:RIFT_SERVER_URL = 'http://127.0.0.1:1/'
          $env:RIFT_SERVER_ACCESS_KEY_FILE = Join-Path $env:RUNNER_TEMP 'synthetic-access-key'
          [IO.File]::WriteAllText($env:RIFT_SERVER_ACCESS_KEY_FILE, ('test-only-key-' * 4))
          try {
            dotnet run --project native/Rift.UiChecks/Rift.UiChecks.csproj -c Release --no-build
            if ($LASTEXITCODE) { throw 'WPF checks failed with inherited backend configuration.' }
          } finally {
            Remove-Item -LiteralPath $env:RIFT_SERVER_ACCESS_KEY_FILE
          }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RiftCompanion-Windows
          path: artifacts/native-profile-v41/
          if-no-files-found: error
          retention-days: 7
